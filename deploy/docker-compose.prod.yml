# Production additions: HTTPS in front of the site with Caddy (free, auto-renewing certificates).
# Run from the repo root:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Needs DOMAIN in .env, and PORT=127.0.0.1:8080 so the plain-HTTP port isn't public.
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
