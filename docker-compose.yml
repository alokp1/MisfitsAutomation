name: misfits

services:
  # Public entrypoint: website at /, QR menu at /cafe/, API at /api/
  web:
    build:
      context: ./website
    image: misfits-web:latest
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - "${PORT:-8080}:80"

  server:
    build:
      context: ./qr-menu/server
    image: qr-menu-server:latest
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_PATH: /app/data/data.sqlite
      # QR codes encode <PUBLIC_BASE_URL>/<cafe>/menu, so this must include /cafe
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080/cafe}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Telegram reminders and nightly summary (optional; see .env.example)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      TELEGRAM_CHAT_SHOJA: ${TELEGRAM_CHAT_SHOJA:-}
      TELEGRAM_CHAT_KASOL: ${TELEGRAM_CHAT_KASOL:-}
      REMINDER_AT: ${REMINDER_AT:-21:00}
      # Guest ID photos from self check-in are deleted this many days after check-out
      ID_RETENTION_DAYS: ${ID_RETENTION_DAYS:-365}
      SUMMARY_AT: ${SUMMARY_AT:-22:30}
    volumes:
      - qr-menu-data:/app/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  client:
    build:
      context: ./qr-menu/client
    image: qr-menu-client:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"

volumes:
  qr-menu-data:
