# Public entrypoint for misfits: serves the static website at / and fronts the
# QR menu app (/cafe/) and its API (/api/).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative Location headers: nginx only knows its container port, not the published one.
    absolute_redirect off;

    # In production Caddy (HTTPS) sits in front on the Docker network: take the visitor's
    # address from the X-Forwarded-For it sets, so per-visitor limits see real guests.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Look the app containers up through Docker's DNS on each request (cached 10s), not once
    # at start: rebuilt containers get new addresses, and a fixed one would mean 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream    http://server:4000;
    set $client_upstream http://client:80;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # QR menu API
    location /api/ {
        # Expenses carry bill photos (the bulk sheet can send many); the server enforces its own limits.
        client_max_body_size 32m;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # QR menu SPA (built with Vite base '/cafe/'); the prefix is stripped, so the
    # client container keeps serving from its own root.
    location /cafe/ {
        rewrite          ^/cafe/(.*)$ /$1 break;
        proxy_pass       $client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /cafe {
        return 301 /cafe/$is_args$args;
    }

    # Short address for property managers' phones
    location = /manage {
        return 302 /cafe/admin;
    }

    # Old QR app URLs (QR codes printed before the move to /cafe/). The app sends
    # cafe-less /cafe/menu to the Shoja menu.
    location = /menu {
        return 301 /cafe/menu$is_args$args;
    }
    location /admin {
        return 301 /cafe$request_uri;
    }

    # Website photos/video are not content-hashed, so cache moderately.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
